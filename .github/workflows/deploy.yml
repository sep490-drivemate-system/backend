name: Deploy to Railway

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore src/DriveMate.sln
      
    - name: Build
      run: dotnet build src/DriveMate.sln --no-restore
      
    - name: Test
      run: dotnet test src/DriveMate.sln --no-build --verbosity normal

  deploy-userservice:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy UserService to Railway
      uses: railwayapp/railway-deploy@v1
      with:
        railway_token: ${{ secrets.RAILWAY_TOKEN }}
        service: userservice
        dockerfile_path: src/UserService/Dockerfile
      env:
        RAILWAY_ENVIRONMENT: production

  deploy-apigateway:
    needs: [test, deploy-userservice]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy API Gateway to Railway
      uses: railwayapp/railway-deploy@v1
      with:
        railway_token: ${{ secrets.RAILWAY_TOKEN }}
        service: apigateway
        dockerfile_path: src/ApiGetwate/Dockerfile
      env:
        RAILWAY_ENVIRONMENT: production
