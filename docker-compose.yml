version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: drivemate-postgres
    environment:
      POSTGRES_DB: drivemate_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - drivemate-network

  # User Service
  userservice:
    build:
      context: .
      dockerfile: src/UserService/Dockerfile
    container_name: drivemate-userservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__USERSERVICECONNECTION=Host=postgres;Database=drivemate_db;Username=postgres;Password=${POSTGRES_PASSWORD:-your_password_here}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    ports:
      - "5100:80"
    depends_on:
      - postgres
    networks:
      - drivemate-network

  # API Gateway
  apigateway:
    build:
      context: .
      dockerfile: src/ApiGetwate/Dockerfile
    container_name: drivemate-apigateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    ports:
      - "5000:80"
    depends_on:
      - userservice
    networks:
      - drivemate-network

volumes:
  postgres_data:

networks:
  drivemate-network:
    driver: bridge
